paths:
  /api/storages/azure_spi/:
    get:
      operationId: list
      summary: ✨ Get Azure SPI import storage
      description: 'This endpoint is not available in Label Studio Community Edition. Learn more about Label Studio Enterprise


        Get list of all Azure import storage connections set up with Service Principal authentication.'
      tags:
      - subpackage_importStorage.subpackage_importStorage/azureSpi
      parameters:
      - name: ordering
        in: query
        description: Which field to use when ordering the results.
        required: false
        schema:
          type: string
      - name: project
        in: query
        description: Project ID
        required: true
        schema:
          type: integer
      - name: Authorization
        in: header
        description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AzureServicePrincipalImportStorage'
    post:
      operationId: create
      summary: ✨ Create Azure import storage with SPI
      description: 'This endpoint is not available in Label Studio Community Edition. Learn more about Label Studio Enterprise


        Create Azure import storage with Service Principal authentication.'
      tags:
      - subpackage_importStorage.subpackage_importStorage/azureSpi
      parameters:
      - name: Authorization
        in: header
        description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureServicePrincipalImportStorage'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AzureServicePrincipalImportStorageRequest'
  /api/storages/azure_spi/validate:
