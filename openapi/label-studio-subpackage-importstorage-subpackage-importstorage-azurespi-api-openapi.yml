        synchronizable:
          type: boolean
          default: true
        tenant_id:
          type:
          - string
          - 'null'
          description: Azure Tenant ID
        title:
          type:
          - string
          - 'null'
          description: Cloud storage title
        traceback:
          type:
          - string
          - 'null'
          description: Traceback report for the last failed sync
        use_blob_urls:
          type: boolean
          description: Interpret objects as BLOBs and generate URLs
        user_delegation_key:
          type:
          - string
          - 'null'
          description: User Delegation Key (Backend)
      required:
      - project
      title: AzureServicePrincipalImportStorageRequest
