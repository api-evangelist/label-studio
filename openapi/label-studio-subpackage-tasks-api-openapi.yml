          type: integer
        comment_count:
          type: integer
          description: Number of comments in the task including all annotations
        comments:
          type: string
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          description: Time a task was created
        data:
          type: object
          additionalProperties:
            description: Any type
