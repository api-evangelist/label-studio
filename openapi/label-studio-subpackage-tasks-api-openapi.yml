openapi: 3.1.0
info:
  title: API Reference subpackage_actions subpackage_tasks API
  version: 1.0.0
servers:
- url: http://localhost:8000
tags:
- name: subpackage_tasks
paths:
  /api/projects/{id}/imports/{import_pk}/:
    get:
      operationId: create-many-status
      summary: 'Get project import status '
      description: "\n            Poll the status of an asynchronous project import operation.\n            \n            **Usage:**\n            1. When you POST to `/api/projects/{project_id}/import`, you'll receive a response like `{\"import\": <import_id>}`\n            2. Use that `import_id` with this GET endpoint to check the import status\n            3. Poll this endpoint to see if the import has completed, is still processing, or has failed\n            4. **Import errors and failures will only be visible in this GET response**, not in the original POST request\n            \n            This endpoint returns detailed information about the import including task counts, status, and any error messages.\n        "
      tags:
      - subpackage_tasks
      parameters:
      - name: id
        in: path
        description: A unique integer value identifying this project import.
        required: true
        schema:
          type: integer
      - name: import_pk
        in: path
        required: true
        schema:
          type: integer
      - name: Authorization
        in: header
        description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectImport'
  /api/projects/{id}/tasks/:
    delete:
      operationId: delete-all-tasks
      summary: Delete all tasks
      description: Delete all tasks from a specific project.
      tags:
      - subpackage_tasks
      parameters:
      - name: id
        in: path
        description: A unique integer value identifying this project.
        required: true
        schema:
          type: integer
      - name: Authorization
        in: header
        description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
  /api/tasks/:
    get:
      operationId: list
      summary: List tasks
      description: 'Retrieve a paginated list of tasks. The response format varies based on the user''s role in the organization:

        - **Admin/Owner**: Full task details with all annotations, reviews, and metadata

        - **Reviewer**: Task details optimized for review workflow

        - **Annotator**: Task details filtered to show only user''s own annotations and assignments'
      tags:
      - subpackage_tasks
      parameters:
      - name: fields
        in: query
        description: Set to "all" if you want to include annotations and predictions in the response. Defaults to task_only
        required: false
        schema:
          $ref: '#/components/schemas/ApiTasksGetParametersFields'
      - name: include
        in: query
        description: Specify which fields to include in the response
        required: false
        schema:
          type: string
      - name: only_annotated
        in: query
        description: Filter to show only tasks that have annotations
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: project
        in: query
        description: Project ID
        required: false
        schema:
          type: integer
      - name: query
        in: query
        description: 'Additional query to filter tasks. It must be JSON encoded string of dict containing one of the following parameters: {"filters": ..., "selectedItems": ..., "ordering": ...}. Check Data Manager > Create View > see data field for more details about filters, selectedItems and ordering.


          filters: dict with "conjunction" string ("or" or "and") and list of filters in "items" array. Each filter is a dictionary with keys: "filter", "operator", "type", "value". Read more about available filters

          Example: {"conjunction": "or", "items": [{"filter": "filter:tasks:completed_at", "operator": "greater", "type": "Datetime", "value": "2021-01-01T00:00:00.000Z"}]}

          selectedItems: dictionary with keys: "all", "included", "excluded". If "all" is false, "included" must be used. If "all" is true, "excluded" must be used.

          Examples: {"all": false, "included": [1, 2, 3]} or {"all": true, "excluded": [4, 5]}

          ordering: list of fields to order by. Currently, ordering is supported by only one parameter.

          Example: ["completed_at"]'
        required: false
        schema:
          type: string
      - name: resolve_uri
        in: query
        description: Resolve task data URIs using Cloud Storage
        required: false
        schema:
          type: boolean
      - name: review
        in: query
        description: Get tasks for review
        required: false
        schema:
          type: boolean
      - name: selectedItems
        in: query
        description: JSON string of selected task IDs for review workflow
        required: false
        schema:
          type: string
      - name: view
        in: query
        description: View ID
        required: false
        schema:
          type: integer
      - name: Authorization
        in: header
        description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleBasedTaskList'
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                description: Any type
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                description: Any type
    post:
      operationId: create
      summary: Create a new task
      description: Create a new task
      tags:
      - subpackage_tasks
      parameters:
      - name: Authorization
        in: header
        description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LseTask'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LseTaskRequest'
  /api/tasks/{id}/:
    get:
      operationId: get
      summary: Get task
      description: Get task data, metadata, annotations and other attributes for a specific labeling task by task ID.
      tags:
      - subpackage_tasks
      parameters:
      - name: id
        in: path
        description: Task ID
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleBasedTask'
    delete:
      operationId: delete
      summary: Delete task
      description: Delete a task in Label Studio. This action cannot be undone!
      tags:
      - subpackage_tasks
      parameters:
      - name: id
        in: path
        description: Task ID
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
    patch:
      operationId: update
      summary: Update task
      description: Update the attributes of an existing labeling task.
      tags:
      - subpackage_tasks
      parameters:
      - name: id
        in: path
        description: Task ID
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleBasedTask'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLseTaskRequest'
  /api/tasks/{id}/events/:
    post:
      operationId: create-event
      summary: Create task event
      description: "\n    Create a new task event to track user interactions and system events during annotation.\n\n    This endpoint is designed to receive events from the frontend labeling interface to enable\n    accurate lead time calculation and detailed annotation analytics.\n\n    ## Event Types\n\n    **Core Annotation Events:**\n    - `annotation_loaded` - When annotation interface is loaded\n    - `annotation_created` - When annotation is submitted\n    - `annotation_updated` - When annotation is modified\n    - `annotation_reviewed` - When annotation is reviewed\n\n    **User Activity Events:**\n    - `visibility_change` - When page visibility changes (tab switch, minimize)\n    - `idle_detected` - When user goes idle\n    - `idle_resumed` - When user returns from idle\n\n    **Interaction Events:**\n    - `region_finished_drawing` - When annotation region is completed\n    - `region_deleted` - When annotation regions are removed\n    - `hotkey_pressed` - When keyboard shortcuts are used\n\n    **Media Events:**\n    - `video_playback_start/end` - Video playback control\n    - `audio_playback_start/end` - Audio playback control\n    - `video_scrub` - Video timeline scrubbing\n\n    ## Usage\n\n    Events are automatically associated with the task specified in the URL path.\n    The current user is automatically set as the actor. Project and organization\n    are derived from the task context.\n\n    ## Example Request\n\n    ```json\n    {\n        \"event_key\": \"annotation_loaded\",\n        \"event_time\": \"2024-01-15T10:30:00Z\",\n        \"annotation\": 123,\n        \"meta\": {\n            \"annotation_count\": 5,\n            \"estimated_time\": 300\n        }\n    }\n    ```\n    "
      tags:
      - subpackage_tasks
      parameters:
      - name: id
        in: path
        description: Task ID to associate the event with
        required: true
        schema:
          type: integer
      - name: Authorization
        in: header
        description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEvent'
        '400':
          description: Bad request - validation errors
          content:
            application/json:
              schema:
                description: Any type
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: Not found - task does not exist
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskEventRequest'
