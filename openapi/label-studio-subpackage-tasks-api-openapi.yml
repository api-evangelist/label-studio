        * `in_progress` - In progress

        * `failed` - Failed

        * `completed` - Completed'
      title: Status7bfEnum
    LseTaskSerializerForReviewers:
      type: object
      properties:
        agreement:
          type: string
        agreement_selected:
          type: string
        allow_skip:
          type:
          - boolean
          - 'null'
          description: Whether this task can be skipped. Set to False to make task unskippable.
        annotation_time:
          type: integer
          description: 'Calculate total annotation time for this task from MetricInTimeBucket records.

            Returns time in seconds.'
        annotations:
          type: string
        annotations_ids:
          type: string
        annotations_results:
          type: string
        annotators:
          type: array
          items:
            $ref: '#/components/schemas/LseTaskSerializerForReviewersAnnotatorsItems'
          description: Who annotated this task; each item includes user_id plus minimal profile fields for Data Manager display.
        annotators_count:
          type: integer
          description: The annotators_count is calculated as the number of users with annotations (can be repeated, so same as the number of annotations) + the number of assignees without annotations.
        avg_lead_time:
          type: number
          format: double
        cancelled_annotations:
          type: integer
        comment_authors:
          type: array
          items:
            type: object
            additionalProperties:
              description: Any type
        comment_authors_count:
          type: integer
        comment_count:
          type: integer
          description: Number of comments in the task including all annotations
        comments:
          type: string
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          description: Time a task was created
        data:
          type: object
          additionalProperties:
            description: Any type
          description: User imported or uploaded data for a task. Data is formatted according to the project label config. You can find examples of data for your project on the Import page in the Label Studio Data Manager UI.
        draft_exists:
          type: boolean
        drafts:
          type: array
          items:
            $ref: '#/components/schemas/LseTaskSerializerForReviewersDraftsItems'
          description: Drafts for this task
        file_upload:
          type: string
        ground_truth:
          type: boolean
        id:
          type: integer
        inner_id:
          type: integer
        is_labeled:
          type: boolean
          description: True if the number of annotations for this task is greater than or equal to the number of maximum_completions for the project
        last_comment_updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the last comment was updated
        meta:
          oneOf:
          - description: Any type
          - type: 'null'
          description: Meta is user imported (uploaded) data and can be useful as input for an ML Backend for embeddings, advanced vectors, and other info. It is passed to ML during training/predicting steps.
        overlap:
          type: integer
          description: Number of distinct annotators that processed the current task
        precomputed_agreement:
          type:
          - number
          - 'null'
          format: double
          description: Average agreement score for the task
        predictions:
          type: array
          items:
            $ref: '#/components/schemas/LseTaskSerializerForReviewersPredictionsItems'
          description: Predictions for this task
        predictions_model_versions:
          type: string
        predictions_results:
          type: string
        predictions_score:
          type: number
          format: double
        project:
          type:
          - integer
          - 'null'
          description: Project ID for this task
        review_time:
          type: integer
          description: 'Calculate total review time for this task from MetricInTimeBucket records.

            Returns time in seconds.'
        reviewed:
          type: boolean
        reviewers:
          type: array
          items:
            type: object
            additionalProperties:
              description: Any type
        reviewers_count:
          type: integer
        reviews_accepted:
          type: integer
        reviews_rejected:
          type: integer
        state:
          type: string
        storage_filename:
          type: string
        total_annotations:
          type: integer
        total_predictions:
          type: integer
        unresolved_comment_count:
          type: integer
          description: Number of unresolved comments in the task including all annotations
        updated_at:
          type: string
          format: date-time
          description: Last time a task was updated
        updated_by:
          type: array
          items:
            $ref: '#/components/schemas/LseTaskSerializerForReviewersUpdatedByItems'
          description: User IDs who updated this task
      required:
      - agreement
      - agreement_selected
      - annotation_time
      - annotations
      - annotations_ids
      - annotations_results
      - annotators
      - annotators_count
      - comment_authors
      - comment_authors_count
      - comments
      - created_at
      - data
      - drafts
      - file_upload
      - id
      - predictions
      - predictions_model_versions
      - predictions_results
      - review_time
      - reviewers
      - reviewers_count
      - state
      - storage_filename
      - updated_at
      - updated_by
      description: Data Manager Task Serializer with FSM state support.
      title: LseTaskSerializerForReviewers
