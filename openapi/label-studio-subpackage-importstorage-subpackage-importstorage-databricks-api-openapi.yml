                $ref: '#/components/schemas/DatabricksImportStorage'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDatabricksImportStorageRequest'
  /api/storages/databricks/{id}/sync:
    post:
      operationId: sync
      summary: ✨ Sync Databricks import storage
      description: "<Card href=\"https://humansignal.com/goenterprise\">\n        <img style=\"pointer-events: none; margin-left: 0px; margin-right: 0px;\" src=\"https://docs.humansignal.com/images/badge.svg\" alt=\"Label Studio Enterprise badge\"/>\n        <p style=\"margin-top: 10px; font-size: 14px;\">\n            This endpoint is not available in Label Studio Community Edition. [Learn more about Label Studio Enterprise](https://humansignal.com/goenterprise)\n        </p>\n    </Card>\nSync tasks from a Databricks Files import storage."
      tags:
      - subpackage_importStorage.subpackage_importStorage/databricks
      parameters:
      - name: id
        in: path
        required: true
        schema:
