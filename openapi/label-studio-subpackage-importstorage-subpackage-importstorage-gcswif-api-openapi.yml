paths:
  /api/storages/gcswif/:
    get:
      operationId: list
      summary: ✨ Get GCS WIF import storage
      description: 'This endpoint is not available in Label Studio Community Edition. Learn more about Label Studio Enterprise


        Get list of all GCS import storage connections set up with WIF authentication.'
      tags:
      - subpackage_importStorage.subpackage_importStorage/gcswif
      parameters:
      - name: ordering
        in: query
        description: Which field to use when ordering the results.
        required: false
        schema:
          type: string
      - name: project
        in: query
        description: Project ID
        required: true
        schema:
          type: integer
      - name: Authorization
        in: header
        description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GCSWIFImportStorage'
    post:
      operationId: create
      summary: ✨ Create GCS import storage with WIF
      description: 'This endpoint is not available in Label Studio Community Edition. Learn more about Label Studio Enterprise


        Create GCS import storage with WIF.'
      tags:
      - subpackage_importStorage.subpackage_importStorage/gcswif
