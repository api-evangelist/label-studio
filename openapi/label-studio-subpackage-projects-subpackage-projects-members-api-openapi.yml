openapi: 3.2.0
info:
  title: Reference Subpackage Projects.subpackage Projects/members…
  version: 1.0.0
servers:
- url: http://localhost:8000
tags:
- name: subpackage_projects.subpackage_projects/members
paths:
  /api/projects/{id}/members/:
    post:
      operationId: add
      summary: ✨ Add project member
      description: 'This endpoint is not available in Label Studio Community Edition. Learn more about Label Studio Enterprise


        Add a member to a specific project.'
      tags:
      - subpackage_projects.subpackage_projects/members
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: Authorization
        in: header
        description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberRequest'
    delete:
      operationId: remove
      summary: ✨ Remove member from project
      description: 'This endpoint is not available in Label Studio Community Edition. Learn more about Label Studio Enterprise


        Remove a member from a specific project. Pass the member ID via the `user` query parameter. For backward compatibility, a JSON body with `user` is still accepted.'
      tags:
      - subpackage_projects.subpackage_projects/members
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: user
        in: query
        description: User ID to remove from the project. Optional for backward compatibility with DELETE body.
        required: false
        schema:
          type: integer
      - name: Authorization
        in: header
        description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
components:
  schemas:
    ProjectMember:
      type: object
      properties:
        user:
          type: integer
      required:
      - user
      title: ProjectMember
    ProjectMemberRequest:
      type: object
      properties:
        user:
          type: integer
      required:
      - user
      title: ProjectMemberRequest
  securitySchemes:
    Token:
      type: apiKey
      in: header
      name: Authorization
      description: 'The token (or API key) must be passed as a request header. You can find your user token on the User Account page in Label Studio. Example: <br><pre><code class="language-bash">curl https://label-studio-host/api/projects -H "Authorization: Token [your-token]"</code></pre>'
