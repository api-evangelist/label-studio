    Webhook:
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionsEnum'
        created_at:
          type: string
          format: date-time
          description: Creation time
        headers:
          description: Key Value Json of headers
        id:
          type: integer
        is_active:
          type: boolean
          description: If value is False the webhook is disabled
        organization:
          type: integer
        project:
          type:
          - integer
          - 'null'
        send_for_all_actions:
          type: boolean
          description: If value is False - used only for actions from WebhookAction
        send_payload:
          type: boolean
          description: If value is False send only action
        updated_at:
          type: string
          format: date-time
          description: Last update time
        url:
          type: string
          format: uri
          description: URL of webhook
      required:
      - created_at
      - id
      - organization
      - updated_at
      - url
      title: Webhook
    WebhookRequest:
      type: object
      properties:
        actions:
          type: array
